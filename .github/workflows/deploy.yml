name: Deploy marimo to Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pinned to the versions the app is developed against, so a working
        # build stays working. Bump these deliberately when you upgrade locally.
        run: pip install marimo==0.23.9 numpy==2.4.3 matplotlib==3.10.8
      - name: Sanity check (compile + dependency graph)
        run: python dev.py check
      - name: Export WASM build
        run: marimo export html-wasm app.py -o dist --mode run
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
